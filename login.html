<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 - zn</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261118b">
</head>
<body class="login-page">
  <header class="login-header">
    <div class="inner">
      <a class="logo" href="index.html">zn</a>
      <a class="back-link" href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        블로그로 돌아가기
      </a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-label="관리자 로그인">
      <div class="head">
        <span class="lock">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <h1>관리자 로그인</h1>
        <p>글을 쓰고 관리하려면 관리자 구글 계정으로 로그인하세요.</p>
      </div>

      <!-- 로그인 성공 (AC-04·05) -->
      <div class="login-form" data-login-done hidden>
        <p class="notice" role="status">로그인되었습니다.</p>
        <a class="btn btn-accent" href="write.html">글쓰기로 이동</a>
        <button type="button" class="forgot link-plain" data-logout>로그아웃</button>
      </div>

      <form class="login-form" data-login-form>
        <p class="setup" data-not-configured hidden>
          아직 로그인 설정(Firebase)이 연결되지 않아 로그인할 수 없어요.
        </p>
        <button type="submit" class="btn btn-google" data-google>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Google 계정으로 로그인
        </button>
        <p class="error" role="alert" data-login-error hidden></p>
        <p class="setup" data-uid-box hidden>
          관리자 등록용 ID: <code data-uid></code><br>
          이 값을 관리자 설정(<code>firebase-config.js</code>, <code>firestore.rules</code>)에 넣으면 이 계정이 관리자가 됩니다.
        </p>
        <label class="check">
          <input type="checkbox" data-keep>
          로그인 상태 유지 (최대 30일)
        </label>
      </form>
    </section>
  </main>
  <script type="module" src="main.js?v=20261118b"></script>
</body>
</html>
