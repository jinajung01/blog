<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기 - zn</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261117b">
</head>
<body class="write-page" data-guard>
  <header class="site-header write-header">
    <div class="wrap">
      <a class="back-link" href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        나가기
      </a>
      <span class="save-state" data-save-state>저장되지 않음</span>
      <div class="right">
        <button type="button" class="back-link link-plain" style="padding: 0 14px" data-logout>로그아웃</button>
        <button type="button" class="btn btn-soft btn-danger-soft" data-write-delete hidden>삭제</button>
        <button type="button" class="btn btn-soft" data-save>임시저장</button>
        <button type="button" class="btn btn-accent" data-publish>발행하기</button>
      </div>
    </div>
  </header>

  <main class="wrap write-main">
    <section class="editor" aria-label="본문 편집">
      <p class="error" role="alert" data-write-error hidden></p>
      <div class="cover-drop" data-cover-drop>
        <input type="file" accept="image/*" hidden data-cover-file>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
        <button type="button" class="link-btn" data-cover-pick>대표 이미지 추가</button>
        <span class="cover-hint" data-cover-hint>JPG·PNG 등 이미지 파일, 끌어다 놓아도 돼요</span>
        <div class="cover-tools" data-cover-tools hidden>
          <button type="button" class="btn btn-soft" data-cover-change>바꾸기</button>
          <button type="button" class="btn btn-soft" data-cover-remove>삭제</button>
        </div>
      </div>
      <label for="title" class="sr-only">제목</label>
      <input id="title" class="title-input" data-title type="text" placeholder="제목을 입력하세요">
      <div class="fmt" role="toolbar" aria-label="서식">
        <button type="button" aria-label="제목 2" title="제목 2" data-fmt="h2" style="font-size:14px">H2</button>
        <button type="button" aria-label="굵게" title="굵게" data-fmt="bold">B</button>
        <button type="button" aria-label="기울임" title="기울임" data-fmt="italic" style="font-style:italic;font-weight:400">I</button>
        <button type="button" aria-label="인용" title="인용" data-fmt="quote"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h4v6H5V9a2 2 0 0 1 2-2z"/><path d="M17 7h4v6h-6V9a2 2 0 0 1 2-2z"/></svg></button>
        <button type="button" aria-label="목록" title="목록" data-fmt="list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
        <button type="button" aria-label="링크" title="링크" data-fmt="link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
        <button type="button" aria-label="이미지" title="이미지" data-fmt="image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
      </div>
      <label for="body" class="sr-only">본문</label>
      <textarea id="body" class="body-input" placeholder="이야기를 시작해 보세요" data-body></textarea>
      <input type="file" accept="image/*" hidden data-inline-file>
      <div class="write-foot">
        <span class="fmt-help">서식: <code>## 소제목</code> <code>**굵게**</code> <code>*기울임*</code> <code>&gt; 인용</code> <code>- 목록</code></span>
        <span class="char-count">공백 포함 <span data-char-count>0</span>자</span>
      </div>
    </section>

    <aside class="side" aria-label="발행 설정">
      <section class="panel">
        <label for="cat">카테고리</label>
        <select id="cat" class="select" data-cat-select>
          <option value="">카테고리 선택</option>
          <option value="plan">기획</option>
          <option value="design">디자인</option>
          <option value="retro">회고</option>
        </select>
      </section>
      <section class="panel">
        <label for="tag">태그</label>
        <form class="tag-row" data-tag-form>
          <input id="tag" type="text" placeholder="태그 입력">
          <button type="submit" class="btn btn-line" style="padding:0 16px">추가</button>
        </form>
        <div class="tag-list" data-tag-list></div>
      </section>
      <section class="panel">
        <h2>공개 범위</h2>
        <div class="radios" role="radiogroup" aria-label="공개 범위">
          <button type="button" class="radio" role="radio" aria-checked="true" data-vis="public"><span class="dot" aria-hidden="true"></span>공개</button>
          <button type="button" class="radio" role="radio" aria-checked="false" data-vis="private"><span class="dot" aria-hidden="true"></span>나만 보기</button>
        </div>
        <p class="hint">나만 보기 글은 방문자에게 보이지 않아요.</p>
      </section>
    </aside>
  </main>
  <script type="module" src="main.js?v=20261117b"></script>
</body>
</html>
