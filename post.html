      <a class="btn btn-accent btn-pill btn-write" href="login.html" data-write-link>

    <nav class="crumb" aria-label="현재 위치">
      <a href="index.html">홈</a><span aria-hidden="true">/</span><a href="posts.html" data-post-crumb>글 목록</a>

    <section class="post-head">
      <span class="eyebrow" data-post-cat></span>
      <h1 data-post-title>글을 불러오는 중…</h1>
      <div class="byline">
        <span class="avatar" aria-hidden="true"></span>
        <div>
          <span data-post-meta></span>
        </div>
      </div>
    </section>

    <div class="post-cover placeholder" data-post-cover>대표 이미지</div>

    <article class="article" data-post-body></article>

    <div class="tags" data-post-tags></div>

    <div class="actions">
      <button type="button" class="action" aria-pressed="false" data-like>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>

      </button>
      <button type="button" class="action" data-copy>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <span>링크 복사</span>
      </button>
    </div>

    <div class="admin-bar" data-admin-bar hidden>
      <span>관리자 메뉴</span>
      <a class="btn btn-line" data-edit href="#">수정</a>
      <button type="button" class="btn btn-danger" data-delete>삭제</button>
    </div>

    <section class="comments" aria-label="댓글">
      <h2>댓글 <span data-comment-count>0</span></h2>
      <form class="comment-form" data-comment-form>
        <label for="comment-name">이름</label>
        <input id="comment-name" class="comment-name" type="text" maxlength="20" placeholder="이름 (비우면 익명)">
        <label for="comment">댓글 작성</label>
        <textarea id="comment" rows="3" maxlength="1000" placeholder="생각을 남겨 주세요"></textarea>
        <p class="error" role="alert" data-comment-error hidden></p>
        <button type="submit" class="btn btn-dark">등록</button>
      </form>
      <div data-comment-list></div>
    </section>

    <nav class="post-nav" aria-label="다른 글" data-post-nav>
      <a href="#" data-prev hidden>
        <span>이전 글</span>
